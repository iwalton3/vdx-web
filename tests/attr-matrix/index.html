<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>VDX attribute-contract matrix</title></head>
<body>
<pre id="out">running...</pre>
<script type="module">
    import { runMatrix } from './run-matrix.js';
    try {
        const result = runMatrix();
        window.__MATRIX__ = result;
        document.getElementById('out').textContent =
            `${result.cells} cells, ${result.rows.length} disagreements`;
    } catch (e) {
        window.__MATRIX__ = { error: e.message, stack: e.stack };
        document.getElementById('out').textContent = 'ERROR: ' + e.message;
    }
</script>
</body>
</html>
